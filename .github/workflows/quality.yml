name: quality

# The required checks are the two summary jobs at the end, `quality /
# governance` and `quality / correctness`; everything above them is a class
# job they depend on. The rulesets require the summary names, so class jobs
# can be added or renamed without touching a ruleset.
#
# workflow_dispatch keeps the manual runs the former per-platform CI workflows
# offered.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Flywheel's release and back-merge commits carry no reviewable change, so
  # class jobs skip on them and the summary jobs still pass.
  classify:
    runs-on: ubuntu-latest
    outputs:
      derived_release_commit: ${{ steps.classify.outputs.derived_release_commit }}
      promotion_pr: ${{ steps.classify.outputs.promotion_pr }}
    steps:
      - id: classify
        uses: point-source/flywheel/classify@59758d1940ebe054ce9fdd4b7a7dc79a0cf235e0 # v2.1.0

  # Calls notation's reusable governance lint: markdownlint-cli2 over the
  # governance docs, SPEC.md status-line validation, and the README heading
  # profile. readme-type: library requires Installation, Usage, API, and
  # License headings in README.md. The job key stays `governance`, so it also
  # reports as `governance / lint` for rulesets that still require that name.
  governance:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    # notation's release tags use a notation--v* prefix, which Dependabot may
    # not auto-track — bump manually if it does not.
    uses: repentsinner/symphonize/.github/workflows/governance-lint.yml@1025d00f32bb7ffdfcddf0385be8e0935559b8c9 # notation--v0.2.12
    with:
      readme-type: library

  lint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  compile-linux:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build and import test
        run: |
          uv sync
          uv run python -c "import pydecklink; print('import OK')"

      - name: Stub freshness
        run: |
          diff -u src/pydecklink/_bindings.pyi \
            .venv/lib/python3.*/site-packages/pydecklink/_bindings.pyi \
            || { echo "::error::Committed stub is stale. Run 'uv sync' and copy the generated _bindings.pyi into src/pydecklink/."; exit 1; }

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/ -x --tb=short --noconftest

  compile-macos:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Build and import test
        run: |
          uv sync
          uv run python -c "import pydecklink; print('import OK')"

      - name: Stub freshness
        run: |
          diff -u src/pydecklink/_bindings.pyi \
            .venv/lib/python3.*/site-packages/pydecklink/_bindings.pyi \
            || { echo "::error::Committed stub is stale. Run 'uv sync' and copy the generated _bindings.pyi into src/pydecklink/."; exit 1; }

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/ -x --tb=short --noconftest

  compile-windows:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Build and import test
        run: |
          uv sync
          uv run python -c "import pydecklink; print('import OK')"

      - name: Stub freshness
        run: |
          $committed = "src\pydecklink\_bindings.pyi"
          $generated = Get-ChildItem -Path ".venv\Lib\site-packages\pydecklink\_bindings.pyi" -ErrorAction Stop
          $diff = Compare-Object (Get-Content $committed) (Get-Content $generated)
          if ($diff) {
            Write-Error "Committed stub is stale. Run 'uv sync' and copy the generated _bindings.pyi into src/pydecklink/."
            exit 1
          }

      - name: Mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/ -x --tb=short --noconftest

  actionlint:
    needs: classify
    if: needs.classify.outputs.derived_release_commit != 'true' && needs.classify.outputs.promotion_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Digest copied from the release's checksums file, so a replaced
      # release asset fails here rather than running.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sfLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      # actionlint skips run: blocks silently when shellcheck is absent, so
      # its absence has to fail the job rather than pass it.
      - name: Lint workflows
        run: |
          command -v shellcheck
          "$RUNNER_TEMP/actionlint"

  # Summary jobs carry the required check names. Each runs whatever its
  # dependencies' outcome, because GitHub counts a skipped required check as
  # passing. classify is a dependency too: if it fails, the class jobs skip.
  quality-governance:
    name: quality / governance
    needs: [classify, governance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a governance job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1

  quality-correctness:
    name: quality / correctness
    needs: [classify, lint, compile-linux, compile-macos, compile-windows, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a correctness job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
