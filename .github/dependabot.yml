version: 2

updates:
  # Keep SHA-pinned GitHub Actions current across all workflows. We pin every
  # `uses:` to a commit SHA (supply-chain hardening); Dependabot bumps those
  # SHAs and updates the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # For the exact pins in pyproject.toml's [build-system] table. The range
  # requirements elsewhere in the file are already satisfied by the latest
  # release, so Dependabot opens nothing for them. A setuptools-scm bump
  # also belongs in build-wheels.yml, which Dependabot does not read.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
