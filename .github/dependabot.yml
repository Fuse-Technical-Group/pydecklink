version: 2

updates:
  # Keep SHA-pinned GitHub Actions current across all workflows. We pin every
  # `uses:` to a commit SHA (supply-chain hardening); Dependabot bumps those
  # SHAs and updates the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release has a week to draw a follow-up fix before it is proposed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: [minor, patch]
    # `build(deps):` keeps the PR out of flywheel's auto_merge types
    # (.flywheel.yml), so a bump waits for a human review.
    commit-message:
      prefix: "build"
      include: "scope"
  # pip, not uv: uv.lock is not tracked, so pyproject.toml is the only file to
  # move. pip reads the exact pins in the [build-system] table; the range
  # requirements elsewhere are already satisfied by the latest release, so
  # Dependabot opens nothing for them. A setuptools-scm bump also belongs in
  # build-wheels.yml, which Dependabot does not read.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
      include: "scope"
  # The hook revs in .pre-commit-config.yaml. ruff runs only from here, so its
  # bump is the one that brings new lint findings.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit-hooks:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
